name: Windows candidate (internal)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lab/**', 'packaging/**', '.github/workflows/windows-candidate.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Build and check packaged executable
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Keep internal candidate and check results
        uses: actions/upload-artifact@v4
        with:
          name: AulaOS-windows-candidate-${{ github.sha }}
          path: |
            dist/installer/*.exe
            dist/packaged-check.json
            dist/build-dependencies.txt
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 14
